---
when:
  - &on-tags
    event:
      - tag
  - &on-main
    event:
      - manual
      - push
    branch: main
  - &on-pull-request
    event:
      - pull_request

steps:
  - name: registry:login
    image: docker.io/library/busybox:latest
    environment:
      FORGE_USERNAME:
        from_secret: forge-username
      FORGE_PASSWORD:
        from_secret: forge-password
      DOCKER_CONFIG: ".docker"
    commands:
      - |
        mkdir -p "$${DOCKER_CONFIG}"
        cat <<EOF > "$${DOCKER_CONFIG}/config.json"
        {
          "auths": {
            "code.hopopops.com": {
              "auth": "$(echo -n "$${FORGE_USERNAME}:$${FORGE_PASSWORD}" | base64 -w 0)"
            }
          }
        }
        EOF

  - name: manifests:main:publish
    image: code.hopopops.com/woodpecker-plugins/oci:1.0.1
    settings:
      docker_config: .docker
      url: oci://code.hopopops.com/kubernetes/vault-operator/manifests:latest
      path: dist
      reproducible: true
      output: json
    when:
      - *on-main

  - name: manifests:mr:fetch
    image: code.hopopops.com/woodpecker-plugins/oci:1.0.1
    failure: ignore
    settings:
      docker_config: .docker
      action: pull
      url: oci://code.hopopops.com/kubernetes/vault-operator/manifests:latest
      path: oci-dist
      clean: true
    when:
      - *on-pull-request
  - name: manifests:mr:diff
    image: docker.io/library/golang:1.27
    environment:
      GOPROXY: https://go.pkgs.cache.valhall.lan,direct
      GOPRIVATE: code.hopopops.com
      GOFLAGS: -buildvcs=false
    commands:
      - make build-installer
      - diff -u --color=always oci-dist/install.yaml dist/install.yaml || true
    when:
      - *on-pull-request

  - name: manifests:release:build
    image: docker.io/library/golang:1.27
    environment:
      GOPROXY: https://go.pkgs.cache.valhall.lan,direct
      GOPRIVATE: code.hopopops.com
      GOFLAGS: -buildvcs=false
    commands:
      - make build-installer IMG="quay.io/hopopops/vault-operator:${CI_COMMIT_TAG}"
    when:
      - *on-tags
  - name: manifests:release:publish
    image: code.hopopops.com/woodpecker-plugins/oci:1.0.1
    settings:
      docker_config: .docker
      url: "oci://code.hopopops.com/kubernetes/vault-operator/manifests:${CI_COMMIT_TAG}"
      path: dist
      reproducible: true
      output: json
    when:
      - *on-tags
