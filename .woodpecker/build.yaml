---
when:
  - event:
      - manual
      - push
      - tag
steps:
  - name: build:login
    image: docker.io/library/busybox:latest
    environment:
      FORGE_USERNAME:
        from_secret: forge-username
      FORGE_PASSWORD:
        from_secret: forge-password
      QUAY_USERNAME:
        from_secret: quay-username
      QUAY_PASSWORD:
        from_secret: quay-password
      DOCKER_USERNAME:
        from_secret: docker-username
      DOCKER_PASSWORD:
        from_secret: docker-password
      DOCKER_CONFIG: ".docker"
    commands:
      - |
        mkdir -p "$${DOCKER_CONFIG}"
        cat <<EOF > "$${DOCKER_CONFIG}/config.json"
        {
          "auths": {
            "code.hopopops.com": {
              "auth": "$(echo -n "$${FORGE_USERNAME}:$${FORGE_PASSWORD}" | base64 -w 0)"
            },
            "https://index.docker.io/v1/": {
              "auth": "$(echo -n "$${DOCKER_USERNAME}:$${DOCKER_PASSWORD}" | base64 -w 0)"
            },
            "quay.io": {
              "auth": "$(echo -n "$${QUAY_USERNAME}:$${QUAY_PASSWORD}" | base64 -w 0)"
            }
          }
        }
        EOF
    when:
      event: tag
  - name: build:package:branch
    image: code.hopopops.com/woodpecker-plugins/buildkit-build:1.0.9
    settings:
      build:
        destinations:
          - code.hopopops.com/kubernetes/vault-operator:${CI_COMMIT_SHA:0:8}
        push: false
    when:
      - event:
          - manual
          - push
  - name: build:package:release
    image: code.hopopops.com/woodpecker-plugins/buildkit-build:1.0.9
    settings:
      buildkit:
        extraEnv:
          - name: DOCKER_CONFIG
            value: ".docker"
      build:
        provenance: true
        sbom: true
        sbomOutputPath: "./sbom-out"
        labels:
          - name: org.opencontainers.image.authors
            value: "Vianney <vianney@hopopops.com>"
          - name: org.opencontainers.image.vendor
            value: HopopOps
          - name: org.opencontainers.image.title
            value: vault-operator
          - name: org.opencontainers.image.description
            value: >-
              An operator to support configuring ACL and KSA bindings to Vault policies and Vault authentication engine roles from within Kubernetes
          - name: org.opencontainers.image.documentation
            value: https://code.hopopops.com/kubernetes/vault-operator/
        # extraOptions:
        #   # multiarch build
        #   - name: platform
        #     value: linux/amd64,linux/arm64
        destinations:
          - code.hopopops.com/kubernetes/vault-operator:${CI_COMMIT_TAG}
          - code.hopopops.com/kubernetes/vault-operator:latest
          - quay.io/hopopops/vault-operator:${CI_COMMIT_TAG}
          - quay.io/hopopops/vault-operator:latest
          - docker.io/hopopops/vault-operator:${CI_COMMIT_TAG}
          - docker.io/hopopops/vault-operator:latest
    when:
      - event:
          - tag
