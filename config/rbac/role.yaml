  resources:
  - kubernetesroles/finalizers
  - tokens/finalizers
  verbs:
  - update
- apiGroups:
  - auth.toolkit.vault.hopopops.com
  resources:
  - kubernetesroles/status
  - tokens/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
