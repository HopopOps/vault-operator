  - sys.toolkit.vault.hopopops.com
  resources:
  - auths/finalizers
  - mounts/finalizers
  - passwordpolicies/finalizers
  - policies/finalizers
  verbs:
  - update
- apiGroups:
  - sys.toolkit.vault.hopopops.com
  resources:
