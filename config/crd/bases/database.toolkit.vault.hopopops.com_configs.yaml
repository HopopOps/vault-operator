---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: configs.database.toolkit.vault.hopopops.com
spec:
  group: database.toolkit.vault.hopopops.com
  names:
    kind: Config
    listKind: ConfigList
    plural: configs
    singular: config
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.path
      name: Path
      type: string
    - jsonPath: .spec.pluginName
      name: Plugin
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Config is the Schema for the configs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Config
            properties:
              allowedRoles:
                default:
                - '*'
                description: |-
                  allowedRoles defines the list of roles allowed to use this connection. A
                  "*" entry allows every role.
                items:
                  type: string
                type: array
              connectionURL:
                description: |-
                  connectionURL defines the connection string used to connect to the database.
                  The "{{username}}" and "{{password}}" templating directives are replaced
                  with the root credentials. Left out of the payload when empty, for plugins
                  without a connection URL (e.g. mongodbatlas).
                type: string
              disableEscaping:
                description: |-
                  disableEscaping defines whether special characters in the username and
                  password are left unescaped. Useful for alternate connection string
                  formats such as ADO.
                type: boolean
              passwordAuthentication:
                description: |-
                  passwordAuthentication, for the PostgreSQL plugin, defines how passwords
                  reach the server. With "scram-sha-256" they are hashed by Vault, with
                  "password" they are sent in plaintext.
                enum:
                - password
                - scram-sha-256
                type: string
              passwordPolicy:
                description: |-
                  passwordPolicy defines the name of the Vault password policy used to
                  generate the passwords of the users handed out by this connection.
                type: string
              path:
                description: path defines the mount path of the database secret engine.
                type: string
              pluginConfig:
                additionalProperties:
                  type: string
                description: |-
                  pluginConfig defines the configuration specific to the database plugin in
                  use, merged into the payload as is.
                type: object
              pluginName:
                description: |-
                  pluginName defines the name of the plugin to use for this connection, such
                  as "postgresql-database-plugin".
                type: string
              pluginVersion:
                description: pluginVersion defines the semantic version of the plugin
                  to use for this connection.
                type: string
              rootCredentials:
                description: rootCredentials defines where to read the credentials
                  of the privileged database account.
                properties:
                  passwordField:
                    default: password
                    description: |-
                      passwordField defines the connection parameter receiving the password,
                      for plugins not using "password" (e.g. "private_key" for mongodbatlas).
                    type: string
                  passwordKey:
                    default: password
                    description: passwordKey defines the key of the Secret holding
                      the password.
                    type: string
                  secretName:
                    description: |-
                      secretName defines the name of a Secret in the same namespace holding the
                      root credentials. The Secret is watched: a change to it is pushed to Vault.
                    type: string
                  usernameField:
                    default: username
                    description: |-
                      usernameField defines the connection parameter receiving the username,
                      for plugins not using "username" (e.g. "public_key" for mongodbatlas).
                    type: string
                  usernameKey:
                    default: username
                    description: |-
                      usernameKey defines the key of the Secret holding the username. Ignored
                      when spec.username is set.
                    type: string
                required:
                - secretName
                type: object
              rootRotationStatements:
                description: |-
                  rootRotationStatements defines the database statements executed to rotate
                  the root credentials.
                items:
                  type: string
                type: array
              username:
                description: |-
                  username defines the name of the privileged database account. It takes
                  precedence over the username read from the referenced Secret.
                type: string
              verifyConnection:
                default: true
                description: verifyConnection defines whether the connection is verified
                  when it is configured.
                type: boolean
            required:
            - path
            - pluginName
            - rootCredentials
            type: object
          status:
            description: status defines the observed state of Config
            properties:
              conditions:
                description: conditions represent the current state of the Config
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsHash:
                description: |-
                  credentialsHash is the hash of the root credentials last pushed to Vault.
                  Vault never returns the password, so this is the only way to notice that
                  the referenced Secret was rotated and the connection needs pushing again.
                type: string
              observedGeneration:
                description: observedGeneration is the .metadata.generation the status
                  was last reconciled against.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
