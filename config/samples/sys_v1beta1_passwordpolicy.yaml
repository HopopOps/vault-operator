apiVersion: sys.toolkit.vault.hopopops.com/v1beta1
kind: PasswordPolicy
metadata:
  labels:
    app.kubernetes.io/name: vault-operator
    app.kubernetes.io/managed-by: kustomize
  name: passwordpolicy-sample
spec:
  policy: |
    length = 24

    rule "charset" {
      charset = "abcdefghijklmnopqrstuvwxyz"
      min-chars = 1
    }

    rule "charset" {
      charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      min-chars = 1
    }

    rule "charset" {
      charset = "0123456789"
      min-chars = 1
    }
